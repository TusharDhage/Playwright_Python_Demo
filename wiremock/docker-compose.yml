version: "3.8"

services:
  wiremock:
    image: wiremock/wiremock:latest
    container_name: wiremock_server
    ports:
      - "8080:8080"
    volumes:
      # Mount our stub mappings into the WireMock container
      - ./mappings:/home/wiremock/mappings
    command:
      - "--verbose"
      - "--port=8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/__admin/mappings"]
      interval: 5s
      timeout: 5s
      retries: 5