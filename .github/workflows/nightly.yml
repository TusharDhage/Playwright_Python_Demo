name: Nightly Regression

on:
  schedule:
    - cron: '30 15 * * 1-5'   # 9pm IST every weekday
  workflow_dispatch:            # allow manual trigger too

jobs:
  nightly_regression:
    name: Nightly - ${{ matrix.browser }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps ${{ matrix.browser }}

      - name: Run full regression suite
        env:
          PYTHONPATH: ${{ github.workspace }}
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          mkdir -p reports/screenshots
          pytest tests/ -m regression \
            --browser ${{ matrix.browser }} \
            --html=reports/nightly_${{ matrix.browser }}_report.html \
            --self-contained-html \
            -v
        continue-on-error: true

      - name: Upload nightly report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-report-${{ matrix.browser }}
          path: |
            reports/nightly_${{ matrix.browser }}_report.html
            reports/screenshots/
          retention-days: 30      # keep nightly reports longer