name: Playwright Tests + API + WireMock + LambdaTest

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: API Tests (Playwright APIRequestContext)
  # ──────────────────────────────────────────────
  api-tests:
    name: "API Tests (Playwright)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Run API Tests
        run: |
          pytest tests/api/ -v -m api \
            --alluredir=allure-results/api \
            --html=reports/api-report.html \
            --self-contained-html

      - name: Upload API test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: reports/api-report.html

  # ──────────────────────────────────────────────
  # JOB 2: WireMock Tests (service mocking)
  # ──────────────────────────────────────────────
  wiremock-tests:
    name: "WireMock Service Mock Tests"
    runs-on: ubuntu-latest

    services:
      wiremock:
        image: wiremock/wiremock:latest
        ports:
          - 8080:8080
        options: >-
          --health-cmd "curl -f http://localhost:8080/__admin/mappings || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Load WireMock stub mappings
        run: |
          for f in wiremock/mappings/*.json; do
            echo "Loading stub: $f"
            curl -s -X POST http://localhost:8080/__admin/mappings \
              -H "Content-Type: application/json" \
              -d @"$f"
          done

      - name: Verify WireMock stubs loaded
        run: |
          curl -s http://localhost:8080/__admin/mappings | python3 -c \
            "import sys,json; d=json.load(sys.stdin); print(f'Loaded {len(d[\"mappings\"])} stub(s)')"

      - name: Run WireMock Tests
        run: |
          pytest tests/wiremock/ -v -m wiremock \
            --alluredir=allure-results/wiremock \
            --html=reports/wiremock-report.html \
            --self-contained-html

      - name: Upload WireMock report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wiremock-test-report
          path: reports/wiremock-report.html

  # ──────────────────────────────────────────────
  # JOB 3: UI Tests on LambdaTest (cross-browser)
  # ──────────────────────────────────────────────
  lambdatest-ui-tests:
    name: "LambdaTest Cross-Browser UI Tests"
    runs-on: ubuntu-latest
    # Only run on push to main (not every PR, to save LambdaTest quota)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run UI Tests on LambdaTest (${{ matrix.browser }})
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
          LT_BROWSER: ${{ matrix.browser }}
        run: |
          pytest tests/ -v -m "smoke" \
            --browser=${{ matrix.browser }} \
            --html=reports/lt-${{ matrix.browser }}-report.html \
            --self-contained-html
        # NOTE: LambdaTest Playwright tunnel/grid setup done via conftest.py
        # See utils/lambdatest_config.py for browser capability config

      - name: Upload LambdaTest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lambdatest-${{ matrix.browser }}-report
          path: reports/lt-${{ matrix.browser }}-report.html

  # ──────────────────────────────────────────────
  # JOB 4: SAST - Bandit Security Scan
  # ──────────────────────────────────────────────
  sast-scan:
    name: "SAST - Bandit Security Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit SAST scan
        run: |
          bandit -r . \
            --exclude ./.venv,./node_modules,./__pycache__ \
            -f json \
            -o reports/bandit-report.json \
            --severity-level medium || true

      - name: Print Bandit Summary
        run: |
          python3 -c "
          import json
          with open('reports/bandit-report.json') as f:
              d = json.load(f)
          m = d.get('metrics', {}).get('_totals', {})
          print(f'High: {m.get(\"SEVERITY.HIGH\",0)}  Medium: {m.get(\"SEVERITY.MEDIUM\",0)}  Low: {m.get(\"SEVERITY.LOW\",0)}')
          "

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-sast-report
          path: reports/bandit-report.json

  # ──────────────────────────────────────────────
  # JOB 5: Allure Report (aggregates all results)
  # ──────────────────────────────────────────────
  allure-report:
    name: "Publish Allure Report"
    runs-on: ubuntu-latest
    needs: [api-tests, wiremock-tests]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download all allure results
        uses: actions/download-artifact@v4
        with:
          path: allure-results/

      - name: Generate Allure Report
        uses: simple-oss/allure-report-action@v1
        with:
          allure_results: allure-results
          allure_report: allure-report

      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/