name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Tests on ${{ matrix.browser }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false        # don't cancel other browsers if one fails
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps ${{ matrix.browser }}

      - name: Run tests
        run: |
          mkdir -p reports/screenshots
          pytest tests/ \
            --browser ${{ matrix.browser }} \
            --html=reports/${{ matrix.browser }}_report.html \
            --self-contained-html \
            -v
        continue-on-error: true

      - name: Upload report for ${{ matrix.browser }}
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.browser }}
          path: |
            reports/${{ matrix.browser }}_report.html
            reports/screenshots/
          retention-days: 14