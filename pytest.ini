[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --html=reports/report.html --self-contained-html
markers =
    smoke: quick sanity checks run on every deploy
    regression: full suite run before release
    login: all login related tests
    navigation: all navigation related tests
    api: all API tests