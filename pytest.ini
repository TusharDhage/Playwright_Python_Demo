[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# pytest.ini — temporary for local viewing
addopts = -v --html=reports/report.html --self-contained-html --alluredir=allure-results
markers =
    smoke: quick sanity checks run on every deploy
    regression: full suite run before release
    login: all login related tests
    navigation: all navigation related tests
    api: all API tests
    mobile: mobile viewport and device emulation tests
    wiremock: tests that require WireMock Docker container
    lambdatest: tests configured to run on LambdaTest grid
